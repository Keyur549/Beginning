<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Player — જ્ઞાન શોધ · The Beginning</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f2430;--muted:#6b7280;--accent:#7c3aed;--accent2:#f59e0b;--sky:#38bdf8;--green:#16a34a;--red:#dc2626;--yellow:#eab308;--line:#e5e7eb;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141220;--card:#1f1d2e;--ink:#f1f0f6;--muted:#a1a1b5;--line:#33314a;}}
*{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
h1{font-size:1.3rem;} h2{font-size:1.05rem;color:var(--accent);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;}
.btn{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;margin:4px 6px 4px 0;}
.btn.secondary{background:var(--accent2);} .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
input,select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 10px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:10px 0;}
.cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.8rem;font-weight:600;padding:3px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;overflow:hidden;}
.cell .badge{position:absolute;top:2px;right:3px;font-size:.55rem;font-weight:700;background:rgba(0,0,0,.35);color:#fff;border-radius:6px;padding:0 3px;}
.cell .ln{position:absolute;bottom:2px;left:3px;font-size:.55rem;font-weight:800;background:#f59e0b;color:#3b2a00;border-radius:6px;padding:0 4px;max-width:92%;white-space:nowrap}.cell.inline{box-shadow:inset 0 0 0 2px #f59e0b}
.cell.marked{background:var(--sky);color:#fff;} .cell.green{background:var(--green);color:#fff;} .cell.red{background:var(--red);color:#fff;} .cell.yellow{background:var(--yellow);color:#332600;}
.timer{font-size:2rem;font-weight:800;color:var(--red);}
.qtext{font-size:1.05rem;font-weight:600;background:var(--bg);padding:10px;border-radius:10px;}
.muted{color:var(--muted);font-size:.85rem;}
.overflow{overflow-x:auto;} ul{padding-left:18px;}
.stbl{width:100%;font-size:.78rem;border-collapse:collapse;border:1px solid var(--line);}
.stbl th,.stbl td{border:1px solid var(--line);padding:7px 8px;text-align:left;}
.stbl th{background:var(--accent);color:#fff;font-weight:700;position:sticky;top:0;}
.stbl tr:nth-child(even) td{background:rgba(124,58,237,.06);}
.stbl td.ok{color:var(--green);font-weight:700;} .stbl td.bad{color:var(--red);font-weight:700;}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.big-winner{position:relative;overflow:hidden;text-align:center;background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff;padding:34px 12px;border-radius:18px;
  box-shadow:0 0 0 3px rgba(255,215,0,.55), 0 0 40px 8px rgba(255,215,0,.35); animation:pop .6s ease-out, glowPulse 1.8s ease-in-out infinite;}
.big-winner::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:sweep 2.6s ease-in-out infinite;pointer-events:none;}
.big-winner .crown{font-size:3.2rem;animation:crownPulse 1.3s ease-in-out infinite;display:inline-block;}
.big-winner .win-cat{font-size:2.3rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;
  background:linear-gradient(90deg,#fff6c8,#ffd700,#fff6c8);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 22px rgba(255,215,0,.55); animation:shimmer 2s linear infinite;}
.big-winner .win-avatar{font-size:4.2rem;margin-top:10px;animation:pop .8s ease-out;}
.big-winner .win-name{font-size:2.1rem;font-weight:800;margin-top:4px;} .big-winner .win-zone{font-size:1.1rem;opacity:.92;}
.spark{position:absolute;font-size:1.3rem;animation:twinkle 1.6s ease-in-out infinite;pointer-events:none;}
@keyframes shimmer{to{background-position:-200% center;}}
@keyframes crownPulse{0%,100%{transform:scale(1) rotate(-5deg);}50%{transform:scale(1.18) rotate(5deg);}}
@keyframes sweep{0%{left:-60%;}100%{left:130%;}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,215,0,.55),0 0 40px 8px rgba(255,215,0,.32);}50%{box-shadow:0 0 0 3px rgba(255,215,0,.85),0 0 60px 14px rgba(255,215,0,.55);}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7) rotate(0deg);}50%{opacity:1;transform:scale(1.25) rotate(20deg);}}
.winmini{position:relative;overflow:hidden;border-radius:14px;padding:14px 6px;text-align:center;
  animation:pop .5s ease-out, glowPulse 1.8s ease-in-out infinite;
  box-shadow:0 0 0 2px rgba(255,215,0,.6), 0 0 16px 3px rgba(255,215,0,.35);}
.winmini::before{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sweep 2.6s ease-in-out infinite;pointer-events:none;}
.winmini .mcrown{font-size:1.3rem;animation:crownPulse 1.3s ease-in-out infinite;display:inline-block;}
.winmini .mlbl{font-size:.72rem;font-weight:900;letter-spacing:.5px;text-transform:uppercase;
  background:linear-gradient(90deg,#fff6c8,#ffd700,#fff6c8);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 2.4s linear infinite;}
.winmini .mav{font-size:2rem;margin:4px 0 2px;animation:pop .8s ease-out;} .winmini .mnm{font-size:1.1rem;font-weight:800;color:#fff;} .winmini .mzn{font-size:.7rem;color:rgba(255,255,255,.85);}
.winmini .mspark{position:absolute;font-size:.9rem;animation:twinkle 1.6s ease-in-out infinite;pointer-events:none;}
.numpop{text-align:center;background:linear-gradient(160deg,#7c3aed,#f59e0b);color:#fff;border-radius:22px;padding:30px 20px;
  box-shadow:0 0 0 3px rgba(255,215,0,.6), 0 0 50px 10px rgba(255,215,0,.4); animation:popBig .45s cubic-bezier(.17,.89,.32,1.49);}
.numpop .lbl{font-size:1.1rem;font-weight:700;letter-spacing:1px;opacity:.9;text-transform:uppercase;}
.numpop .num{font-size:5rem;font-weight:900;line-height:1.1;text-shadow:0 0 24px rgba(255,255,255,.6);}
@keyframes popBig{0%{transform:scale(.3);opacity:0;}70%{transform:scale(1.12);opacity:1;}100%{transform:scale(1);}}

#scov{position:fixed;inset:0;z-index:9999;background:rgba(15,10,40,.88);display:flex;align-items:center;justify-content:center;padding:14px}
#scbox{width:100%;max-width:380px;text-align:center;color:#fff}
#scwrap{position:relative;width:100%;aspect-ratio:1/1.1;border-radius:22px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#scmsg{position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,#2a1b5e,#0d0a24 70%);color:#f7e7b0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:7px;border:2px solid #d4af37;border-radius:22px}
#scmsg .tr{font-size:.8rem;letter-spacing:.5px;font-weight:800;color:#1a1033;background:linear-gradient(90deg,#f6d365,#d4af37,#f6d365);border-radius:99px;padding:4px 14px}
#scmsg .e{font-size:2.1rem}#scmsg .h{font-size:1.3rem;font-weight:900;color:#ffd96b}#scmsg .t{font-size:.95rem;font-weight:500;line-height:1.55;color:#f1e9ff}
@keyframes scpop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
#scmsg .sp{font-size:.82rem;font-style:italic;line-height:1.5;color:#ffe9a8;opacity:.95;padding:0 4px}
#scmsg .nt{font-size:.82rem;font-weight:700;color:#1a1033;background:linear-gradient(90deg,#f6d365,#ffe9a8,#f6d365);border-radius:12px;padding:7px 10px;line-height:1.45}
#scmsg .s{font-size:.85rem;font-weight:700;color:#ffd96b;border:1px dashed #d4af37;border-radius:12px;padding:7px 10px;line-height:1.5}
#sccv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}

.boxg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.mbox{aspect-ratio:1;border-radius:16px;background:linear-gradient(145deg,#8b5cf6,#5b21b6);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.2rem;border:3px solid #f59e0b;cursor:pointer;box-shadow:0 6px 16px rgba(91,33,182,.35);transition:transform .15s}
.mbox small{font-size:.8rem;font-weight:700;opacity:.9}.mbox:active{transform:scale(.94)}
.mbox.sel{border-color:#fff;box-shadow:0 0 0 4px #f59e0b,0 0 26px 6px rgba(245,158,11,.7)}.mbox.dim{opacity:.4;filter:grayscale(.5)}
.mbox.open{background:linear-gradient(145deg,#fde68a,#f59e0b);color:#3b2a00;animation:pop .5s ease-out}.mbox.open b{font-size:1.9rem;line-height:1}
.prog{text-align:center;padding:10px;font-weight:700;border-radius:12px;background:var(--card);border:1px solid var(--line);margin:10px 0}
</style>
</head>
<body>
<div class="wrap" id="app">Loading…</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const EMOJI_LIST=['🦁','🐯','🐼','🐵','🦊','🐸','🐧','🦉','🐢','🐝','🌸','⭐','🔥','🚀','👑','🎯'];
const IS_HOST=false;
const WINNER_ORDER=['line1','line2','line3','line4','line5','full','top3','top2','top1','zone'];
// ===== Premium reveal music (Web Audio, generated live: no audio files) =====
const PM=(function(){
  let ctx=null,bus=null,master=null,padT=null,spT=null,fadeT=null,on=true,lastStep=-1,running=false,stoppedFor=-2,ci=0;
  try{ on=localStorage.getItem('pmOn')!=='0'; }catch(e){}
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function ensure(){
    if(ctx) return ctx;
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; ctx=new AC();
      const comp=ctx.createDynamicsCompressor(); master=ctx.createGain(); master.gain.value=on?0.9:0;
      bus=ctx.createGain();
      const len=Math.floor(ctx.sampleRate*2.4), buf=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let c=0;c<2;c++){ const d=buf.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
      const verb=ctx.createConvolver(); verb.buffer=buf; const vg=ctx.createGain(); vg.gain.value=.4;
      bus.connect(comp); bus.connect(verb); verb.connect(vg); vg.connect(comp); comp.connect(master); master.connect(ctx.destination);
    }catch(e){ ctx=null; }
    return ctx;
  }
  function note(m,t,dur,type,vol,o){ o=o||{};
    const x=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
    x.type=type; x.frequency.value=hz(m); if(o.det) x.detune.value=o.det;
    f.type='lowpass'; f.frequency.value=o.lp||2400;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+(o.a||0.02)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    x.connect(f); f.connect(g); g.connect(bus); x.start(t); x.stop(t+dur+0.05);
  }
  function thump(t){ const x=ctx.createOscillator(),g=ctx.createGain(); x.type='sine'; x.frequency.setValueAtTime(150,t); x.frequency.exponentialRampToValueAtTime(42,t+0.4);
    g.gain.setValueAtTime(0.55,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.55); x.connect(g); g.connect(bus); x.start(t); x.stop(t+0.6); }
  function chord(ms,t,dur,vol){ ms.forEach((m,i)=>{ note(m,t+i*0.07,dur,'sawtooth',vol,{det:-7,lp:2600,a:0.03}); note(m,t+i*0.07,dur,'sawtooth',vol,{det:7,lp:2600,a:0.03}); }); note(ms[0]-12,t,dur,'triangle',vol*2.2,{lp:500,a:0.02}); }
  const PENTA=[0,2,4,7,9];
  function spark(){ if(!ctx||!running||Math.random()<.35) return; const m=84+PENTA[Math.floor(Math.random()*5)]+(Math.random()<.4?12:0); note(m,ctx.currentTime+0.02,1.6,'sine',0.018,{lp:6000,a:0.01}); }
  const PAD=[[48,55,64,67],[45,52,60,64],[41,48,57,60],[43,50,59,62]];
  function pad(){ if(!ctx||!running) return; const t=ctx.currentTime+0.05, c=PAD[ci++%4]; c.forEach(m=>note(m,t,5.6,'triangle',0.04,{lp:900,a:1.4})); }
  function sting(kind){
    if(!ensure()) return; const t=ctx.currentTime+0.05;
    if(kind==='win'){ thump(t); chord([60,64,67,72],t,2.4,0.05); for(let i=0;i<5;i++) note(88+PENTA[i%5],t+0.35+i*0.09,1.4,'sine',0.03,{lp:7000,a:0.01}); }
    else { thump(t); chord([60,64,67,72],t,1.0,0.05); chord([65,69,72,77],t+0.5,1.0,0.05); chord([67,71,74,79],t+1.0,1.0,0.055); thump(t+1.5); chord([72,76,79,84],t+1.5,4.2,0.06);
      for(let i=0;i<14;i++) note(84+PENTA[i%5]+(i>8?12:0),t+1.6+i*0.11,1.8,'sine',0.03,{lp:7000,a:0.01}); }
  }
  function btn(show){
    let b=document.getElementById('pmbtn');
    if(!show){ if(b) b.style.display='none'; return; }
    if(!b){ b=document.createElement('button'); b.id='pmbtn'; b.type='button'; b.title='Music On/Off';
      b.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9998;width:46px;height:46px;border-radius:50%;border:2px solid #d4af37;background:#1a1240;color:#ffd96b;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)';
      b.onclick=function(){ on=!on; try{localStorage.setItem('pmOn',on?'1':'0');}catch(e){} if(ensure()){ if(ctx.state==='suspended') ctx.resume(); master.gain.setTargetAtTime(on?0.9:0,ctx.currentTime,0.05); } btn(true); };
      document.body.appendChild(b); }
    b.style.display='block'; b.textContent=on?'🎵':'🔇';
  }
  function start(){ if(running) return; running=true; pad(); padT=setInterval(pad,4600); spT=setInterval(spark,650); }
  function stop(){ running=false; clearInterval(padT); clearInterval(spT); if(fadeT){clearTimeout(fadeT);fadeT=null;} }
  function unlock(){ if(ensure() && ctx.state==='suspended') ctx.resume(); }
  ['pointerdown','touchstart','keydown','click'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
  function sync(r,len){
    const live=!!r && r.status==='revealed', step=live?(r.revealStep||0):-1;
    if(!live){ if(running) stop(); lastStep=-1; stoppedFor=-2; btn(false); return; }
    btn(true); if(!ensure()) return; if(ctx.state==='suspended') ctx.resume();
    if(step!==lastStep){ lastStep=step; if(step>=1) sting(step>len?'grand':'win'); if(fadeT){clearTimeout(fadeT);fadeT=null;} stoppedFor=-2; }
    if(!running && stoppedFor!==step && step>=1) start();
    if(step>len && !fadeT && running) fadeT=setTimeout(function(){ stop(); stoppedFor=step; },30000);
  }
  return {sync:sync};
})();
function musicSync(r){ try{ PM.sync(r,WINNER_ORDER.length); }catch(e){} }
const WINNER_LABELS={line1:'1 Line',line2:'2 Line',line3:'3 Line',line4:'4 Line',line5:'5 Line',full:'Full House',top3:'🥉 3rd Score',top2:'🥈 2nd Score',top1:'🥇 Overall Champion',zone:'🏅 Zone Winner'};
const prefillCode=(new URLSearchParams(location.search).get('code')||'').toUpperCase();
let state={
  screen:'join',
  profile: JSON.parse(localStorage.getItem('quizProfile')||'{"name":"","avatar":"🦁","zone":""}'),
  joinErr:'',
  code:null, name:null, room:null, joinErr:''
};
let audioOn=true, uploadedPhoto=null;
function getClientId(){
  let id = localStorage.getItem('quizClientId');
  if(!id){ id = 'c'+Date.now()+Math.random().toString(36).slice(2); localStorage.setItem('quizClientId', id); }
  return id;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let currentUtterance=null;
function toggleAudio(){ audioOn=!audioOn; if(!audioOn && 'speechSynthesis' in window) window.speechSynthesis.cancel(); render(); }
function speakQuestion(text, force){
  if(!('speechSynthesis' in window)){ if(force) alert('આ browser Speech સપોર્ટ નથી કરતું.'); return; }
  if(!audioOn && !force) return;
  const synth=window.speechSynthesis;
  const doSpeak=()=>{
    const voices=synth.getVoices();
    const gv=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('gu'));
    if(force && voices.length===0){ alert('આ device પર કોઈ TTS voice મળી નથી.'); return; }
    const u=new SpeechSynthesisUtterance(text);
    u.lang='gu-IN'; u.rate=0.95; if(gv) u.voice=gv;
    if(force) u.onerror=(e)=>alert('Speech Error: '+(e.error||'unknown'));
    currentUtterance=u;
    synth.speak(u);
  };
  try{
    if(synth.speaking||synth.pending) synth.cancel();
    setTimeout(()=>{ if(synth.getVoices().length) doSpeak(); else synth.onvoiceschanged=doSpeak; }, 150);
  }catch(e){ if(force) alert('Audio error: '+e.message); }
}
setInterval(()=>{ if('speechSynthesis' in window && window.speechSynthesis.paused) window.speechSynthesis.resume(); },4000);
let lastSpokenIdx=null;
function maybeSpeak(r){ if(r.status==='question' && r.curIdx!=null && r.curIdx!==lastSpokenIdx){ lastSpokenIdx=r.curIdx; speakQuestion(r.questions[r.curIdx].q); } else if(r.status==='active'||r.status==='lobby') lastSpokenIdx=null; }

function uiJoinRoom(){
  const name=document.getElementById('joinName').value.trim();
  const zone=document.getElementById('joinZone').value.trim();
  const avatar=document.getElementById('joinAvatar').value;
  const keepForm=()=>{ render(); document.getElementById('joinName').value=name; document.getElementById('joinZone').value=zone; document.getElementById('joinAvatar').value=avatar; document.getElementById('joinCode').value=code; };
  const code=document.getElementById('joinCode').value.trim().toUpperCase();
  if(!name){ state.joinErr='તમારું નામ નાખો.'; keepForm(); return; }
  if(!zone){ state.joinErr='Zone નું નામ નાખો.'; keepForm(); return; }
  state.profile={name,avatar,zone};
  socket.emit('player:join',{code,name,zone,avatar,clientId:getClientId()},(res)=>{
    if(!res.ok){ state.joinErr=res.error; keepForm(); return; }
    state.code=code; state.name=res.yourKey; state.joinErr='';
    state.room=res.room; socket.emit('subscribe',{code,clientId:getClientId()}); render();
    if(!res.resumed && res.yourKey!==name.trim()) alert('બીજા Zone માં આ નામ પહેલેથી છે — તમે "'+res.yourKey+'" તરીકે Join થયા. Winner list માં આ જ નામ શોધજો.');
  });
}
socket.on('state', r=>{ if(state.code && r.code===state.code){ state.room=r; qaAuto(r); maybeSpeak(r); render(); musicSync(r); scAutoCheck(r); } });
function scAutoCheck(r){ try{ if(r.status==='revealed' && r.scReveal && (r.revealStep||0)>WINNER_ORDER.length){ const k='scAuto_'+r.code+'_'+(r.createdAt||''); if(localStorage.getItem(k)) return; localStorage.setItem(k,'1'); setTimeout(()=>{ try{scOpen();}catch(e){} },700); } }catch(e){} }
socket.on('me', m=>{ if(state.code&&state.room&&m&&m.name===state.name&&state.room.status!=='revealed'){ state.room.players[m.name]=m.p; render(); } });
socket.on('connect', ()=>{ if(state.code) socket.emit('subscribe',{code:state.code,clientId:getClientId()},(res)=>{ if(res&&res.ok&&res.room){ state.room=res.room; render(); } }); });
// if the server slept/restarted and the host restored the game, re-join the room automatically
setInterval(()=>{ if(state.code) socket.emit('resync',{code:state.code,clientId:getClientId()},(res)=>{ if(res&&res.ok&&res.room){ state.room=res.room; render(); } }); },4000);

function boxPick(i){ const r=state.room; if(!r||r.status!=='box') return; const p=r.players[state.name]; if(p&&(p.boxPick||[])[r.round]!=null) return; socket.emit('player:boxPick',{code:state.code,name:state.name,idx:i}); }
function boxHist(p,r){ const res=p.boxRes||[]; const nR=(r.cfg&&r.cfg.rounds)||7; const got=res.map((v,i)=>v==null?null:i).filter(i=>i!=null); if(!got.length) return '';
  let sum=0; const chips=got.map(i=>{ const v=res[i]; sum+=v; return `<span style="display:inline-block;background:#fff7d6;border:1px solid #f59e0b;color:#3b2a00;border-radius:10px;padding:2px 8px;margin:2px;font-weight:800;font-size:.85rem">R${i+1}: ${v>0?'+'+v:v}${i===nR-1&&r.cfg&&r.cfg.lastMult>1?' (×'+r.cfg.lastMult+')':''}</span>`; }).join('');

function lineTags(pname,greenOnly){
  const r=state.room,p=r.players[pname]; const tags={};

  return LINES.filter(line=>line.every(ci=>p.marks[ci]!==undefined)).length;

function playerResults(pname){
  const r=state.room,p=r.players[pname]; const cellState=Array(25).fill('none');
  Object.entries(p.marks).forEach(([ci,qi])=>{ci=+ci; cellState[ci]=(r.questions[qi]&&r.questions[qi].a===p.card[ci])?'green':'red';});
  const usedAnswers=r.usedIdx.map(i=>r.questions[i].a);
  for(let ci=0;ci<25;ci++) if(cellState[ci]==='none'&&usedAnswers.includes(p.card[ci])) cellState[ci]='yellow';
  const LINES=(()=>{const L=[];for(let x=0;x<5;x++)L.push([0,1,2,3,4].map(c=>x*5+c));for(let x=0;x<5;x++)L.push([0,1,2,3,4].map(y=>y*5+x));L.push([0,6,12,18,24]);L.push([4,8,12,16,20]);return L;})();
  const correctRows=LINES.filter(line=>line.every(ci=>cellState[ci]==='green')).length;
  const correctCount=cellState.filter(s=>s==='green').length;
  const wrongCount=cellState.filter(s=>s==='red').length;
  const rounds=roundBreakdown(r,p);
  const netScore=rounds.reduce((a,o)=>a+o.score,0);   // FINAL SCORE = correct x2 - wrong x1 + Mystery Box
  const boxTotal=rounds.reduce((a,o)=>a+o.box,0);

  return {cellState,correctRows,correctCount,wrongCount,netScore,boxTotal,rounds,fullHouse};
}
function roundBreakdown(r,p){
  const cfg=r.cfg||{}, n=cfg.rounds||7, per=cfg.perRound||5, cp=cfg.correctPts||2, wp=cfg.wrongPts||1;
  const rd=Array.from({length:n},()=>({correct:0,wrong:0,box:0,score:0}));
  Object.entries(p.marks).forEach(([ci,qi])=>{ const ri=Math.floor(qi/per); if(!rd[ri]) return; if(r.questions[qi]&&r.questions[qi].a===p.card[+ci]) rd[ri].correct++; else rd[ri].wrong++; });
  rd.forEach((o,ri)=>{ const pick=(p.boxPick||[])[ri]; const v=(pick!=null&&p.boxVals&&p.boxVals[ri])?p.boxVals[ri][pick]:0; o.box=v*((ri===n-1)?(cfg.lastMult||1):1); o.score=o.correct*cp-o.wrong*wp+o.box; });
  return rd;
}

function wcMine(){

  ['line1','line2','line3','line4','line5','full','top3','top2','top1'].forEach(k=>{ if(w[k]===n){
    let detail=''; if(/^top/.test(k)) detail='🎯 Final Score '+w[k+'_score']; else if(w[k+'_ms']!=null) detail='⏱ '+fmtDur(w[k+'_ms'])+' માં';
    out.push({k,label:WINNER_LABELS[k].replace(/^[^\w઀-૿]+/,'').trim()||WINNER_LABELS[k],name:pl.baseName||n,zone:pl.zone||'',avatar:pl.avatar||'🏆',detail,code:r.code}); }});
  if(w.zone && pl.zone && w.zone===pl.zone) out.push({k:'zone',label:'Zone Winner',name:pl.baseName||n,zone:pl.zone,avatar:'🏅',detail:'સરેરાશ Final Score '+w.zone_avg+' · '+w.zone_count+' Players',code:r.code});
  return out;
}
async function cardShare(canvas,fname,title){
  if(fname!=='scratch-message.png') scMarkDl();
  canvas.toBlob(async b=>{ const f=new File([b],fname,{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f],title}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fname; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); },'image/png');
}

    body+=`<div class="card"><h2>તમારા Claims</h2><ul>${Object.keys(p.claims||{}).map(k=>{
      const c=p.claims[k]; const valid=c.valid===true;
      return `<li>${labels[k]}: ${valid?'✅ Valid':'❌ Invalid'} — 🕒 ${fmtTime(c.ts)} (${fmtDur(c.ts-(r.startedAt||r.createdAt))} માં)</li>`;
    }).join('')||'<span class="muted">કોઈ claim કર્યો નથી</span>'}</ul>
    ${step>WINNER_ORDER.length && r.winners && r.winners.full===state.name?'<div style="font-size:1.1rem">🏆 તમે Grand Champion છો! 🎉</div>':''}
    ${step>WINNER_ORDER.length && r.winners && r.winners.top1===state.name?'<div style="font-size:1.05rem">🥇 તમે Overall Champion છો!</div>':''}
    ${step>WINNER_ORDER.length && r.winners && r.winners.top2===state.name?'<div style="font-size:1.05rem">🥈 તમે 2nd Score Winner છો!</div>':''}
    ${step>WINNER_ORDER.length && r.winners && r.winners.top3===state.name?'<div style="font-size:1.05rem">🥉 તમે 3rd Score Winner છો!</div>':''}
    ${step>WINNER_ORDER.length?wcMineHTML()+'<div style="margin-top:10px;padding:12px;border-radius:14px;background:#fdf2f8;text-align:center"><div style="font-size:1.15rem;font-weight:800">🙏 ભાગ લેવા બદલ ધન્યવાદ!</div><div class="muted">તમારું Thank You Card મેળવો</div><button class="btn secondary" onclick="tyMine()">🖼 મારું Thank You Card</button></div>'+(scOn()?'<div style="margin-top:10px;padding:12px;border-radius:14px;background:linear-gradient(135deg,#ede9fe,#fce7f3);text-align:center"><div style="font-size:1.15rem;font-weight:800">🎁 તમારું Scratch Card</div><div class="muted">'+(scOn()?'તમારા માટે ખાસ સંદેશ – ઘસીને જુઓ!':'🔒 Host Scratch Card ખોલશે ત્યારે ખુલશે')+'</div><button class="btn" onclick="scOpen()">'+(scOn()?'🎁 Scratch કરો':'🔒 Scratch Card')+'</button></div>':'')+'':''}
    </div>`;
    const revMap={}; Object.entries(p.marks).forEach(([ci,qi])=>{revMap[qi]=+ci;});
    const cf=r.cfg||{};
    body+=`<div class="card overflow"><h2>તમારો Summary (${res.correctCount} Correct / ${res.wrongCount} Wrong)</h2>
    <div style="text-align:center;margin:8px 0 12px;padding:14px;border-radius:16px;background:${res.netScore<0?'#fee2e2':'#dcfce7'}">
      <div style="font-size:.95rem;font-weight:700;color:#444">🎯 Final Score</div>
      <div style="font-size:4.2rem;line-height:1.1;font-weight:900;color:${res.netScore<0?'#dc2626':'#16a34a'}">${res.netScore}</div>
      <div class="muted" style="color:#444">${res.correctCount} સાચા ×${cf.correctPts||2} − ${res.wrongCount} ખોટા ×${cf.wrongPts||1} + 🎁 Box ${res.boxTotal>0?'+'+res.boxTotal:res.boxTotal}</div>
      <button class="btn" style="margin-top:10px" onclick="reportHtmlMine()">⬇ મારો Report Download કરો</button></div>
    <h2>📊 Round wise Marks</h2>${roundTableHTML(res,cf)}
    <h2 style="margin-top:16px">📝 Question wise</h2>
    <table class="stbl">
    <tr><th>#</th><th>Question</th><th>તમારો જવાબ</th><th>સાચો જવાબ</th><th>Result</th></tr>
    ${r.usedIdx.slice().sort((a,b)=>a-b).map(qi=>{
      const ci=revMap[qi]; const given=ci!==undefined?p.card[ci]:'—';
      const ok=ci!==undefined && r.questions[qi].a===given;
      const cls=ci===undefined?'':(ok?'ok':'bad');
      return `<tr><td>${qi+1}</td><td>${esc(r.questions[qi].q)}</td><td>${esc(given)}</td><td>${ok?'—':esc(r.questions[qi].a)}</td><td align="center" class="${cls}">${ci===undefined?'—':(ok?'✅':'❌')}</td></tr>`;
    }).join('')}
    </table></div>`;
  }
  el.innerHTML=body;
}
setInterval(()=>{ if(state.room && (state.room.status==='question' || (state.room.status==='box' && !(state.room.players[state.name]&&(state.room.players[state.name].boxPick||[])[state.room.round]!=null)))) render(); },1000);
render();
if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())); caches && caches.keys && caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))); }
</script>
</body>
</html>
